<?xml version="1.0" encoding="UTF-8"?>
<!--
  banner.svg
  Neon cyberpunk animated hero banner for Kimaya Chavan profile README.
  - Dark-first palette (BG #0a0e17, panel #111827)
  - Neon cyan #00F0FF primary, magenta #FF2BD6 accent, violet #8A2BE2
  - Uses only inline SVG + CSS/SMIL animation, no external resources.
  - Keep under ~300 KB.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">Banner: KIMAYA CHAVAN — Robotics Perception Engineer in Training. Animated LiDAR sweep and neon cyberpunk HUD.</title>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0a0e17"/>
      <stop offset="1" stop-color="#070812"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0" />
      <stop offset="0.5" stop-color="#00F0FF" stop-opacity="0.06" />
      <stop offset="1" stop-color="#000" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style><![CDATA[
      .panel{fill:url(#bg)}
      .hud{fill:#0b1220}
      .scanline{fill:url(#scan); mix-blend-mode:screen}
      .dot{fill:#00F0FF; opacity:0.9}
      .accent{fill:#FF2BD6}
      .title{font-family: 'Fira Code', monospace; font-weight:700; font-size:48px; fill:#00F0FF}
      .subtitle{font-family: 'Fira Code', monospace; font-size:18px; fill:#8A2BE2}
      .glitch{animation:glitch 2s infinite steps(2,end);}
      @keyframes glide { from{transform:translateX(-50px);} to{transform:translateX(1200px);} }
      @keyframes sweep { 0% { stroke-dashoffset: 1600; } 100% { stroke-dashoffset: 0; } }
      @keyframes blink { 0%,40%{opacity:1}41%,50%{opacity:0}51%,100%{opacity:1} }
      @keyframes glitch { 
        0%{opacity:1; transform:translate(0);} 
        20%{transform:translate(-2px,1px);} 
        40%{transform:translate(2px,-1px);} 
        60%{transform:translate(-1px,0);} 
        80%{transform:translate(1px,1px);} 
        100%{transform:translate(0);} }
    ]]></style>
  </defs>

  <!-- background panel -->
  <rect width="1200" height="300" rx="6" class="panel" />

  <!-- subtle HUD rectangle -->
  <rect x="20" y="20" width="1160" height="260" rx="6" fill="#0f1720" opacity="0.6"/>

  <!-- scanlines -->
  <g transform="translate(0,40)">
    <rect width="1200" height="220" class="scanline" opacity="0.12"/>
    <!-- animated sweep bar -->
    <g>
      <rect x="-400" y="0" width="400" height="220" fill="#00F0FF" opacity="0.03">
        <animate attributeName="x" from="-400" to="1200" dur="6s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- pseudo LiDAR point cloud (animated small points moving upward to simulate sweep) -->
  <g id="points" transform="translate(120,60)">
    <!-- create rows of points -->
    <g fill="#00F0FF" opacity="0.8">
      <circle class="dot" cx="0" cy="180" r="1.8">
        <animate attributeName="cy" values="200;0;200" dur="5s" repeatCount="indefinite" begin="0s" />
        <animate attributeName="opacity" values="0.05;0.9;0.05" dur="5s" repeatCount="indefinite" />
      </circle>
      <circle class="dot" cx="40" cy="170" r="1.6">
        <animate attributeName="cy" values="200;0;200" dur="5.4s" repeatCount="indefinite" begin="0.2s" />
      </circle>
      <circle class="dot" cx="80" cy="190" r="1.4">
        <animate attributeName="cy" values="200;0;200" dur="5.2s" repeatCount="indefinite" begin="0.4s" />
      </circle>
      <circle class="dot" cx="140" cy="160" r="1.6">
        <animate attributeName="cy" values="200;0;200" dur="5.6s" repeatCount="indefinite" begin="0.6s" />
      </circle>
      <circle class="dot" cx="220" cy="175" r="1.2">
        <animate attributeName="cy" values="200;0;200" dur="5.1s" repeatCount="indefinite" begin="0.8s" />
      </circle>
      <circle class="dot" cx="320" cy="185" r="1.6">
        <animate attributeName="cy" values="200;0;200" dur="5.7s" repeatCount="indefinite" begin="1s" />
      </circle>
      <circle class="dot" cx="420" cy="170" r="1.3">
        <animate attributeName="cy" values="200;0;200" dur="5.3s" repeatCount="indefinite" begin="1.2s" />
      </circle>
      <circle class="dot" cx="520" cy="160" r="1.1">
        <animate attributeName="cy" values="200;0;200" dur="5.8s" repeatCount="indefinite" begin="1.4s" />
      </circle>
      <circle class="dot" cx="620" cy="190" r="1.6">
        <animate attributeName="cy" values="200;0;200" dur="5.5s" repeatCount="indefinite" begin="1.6s" />
      </circle>
      <circle class="dot" cx="740" cy="180" r="1.4">
        <animate attributeName="cy" values="200;0;200" dur="5.2s" repeatCount="indefinite" begin="1.8s" />
      </circle>
    </g>
  </g>

  <!-- sweeping LiDAR arc -->
  <g transform="translate(900,180)">
    <path d="M-360,40 A360,360 0 0 1 0,-320" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.12" stroke-linecap="round"/>
    <path id="sweep" d="M-360,40 A360,360 0 0 1 0,-320" fill="none" stroke="#39FF14" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1600" stroke-dashoffset="1600" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="1600" to="0" dur="2.8s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Title with glitch layers -->
  <g transform="translate(60,110)">
    <text class="title" x="0" y="0">KIMAYA CHAVAN</text>
    <text class="title glitch" x="0" y="0" fill="#FF2BD6" style="mix-blend-mode: screen; opacity:0.7; transform:translate(1px,0);">KIMAYA CHAVAN</text>
    <text class="title glitch" x="0" y="0" fill="#8A2BE2" style="mix-blend-mode: screen; opacity:0.5; transform:translate(-1px,0);">KIMAYA CHAVAN</text>
    <text class="subtitle" x="0" y="36">Robotics Perception Engineer in Training</text>
  </g>

  <!-- status pulsing lime dot -->
  <g transform="translate(60,180)">
    <circle cx="6" cy="6" r="6" fill="#39FF14">
      <animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="10" fill="#c7f9f9" font-family="Fira Code, monospace" font-size="12">OPEN TO: robotics perception / computer vision internships</text>
  </g>

  <!-- telemetry corner boxes -->
  <g transform="translate(990,16)">
    <rect width="190" height="36" rx="4" fill="#07101a" stroke="#00F0FF" opacity="0.12"/>
    <text x="10" y="22" fill="#00F0FF" font-family="Fira Code, monospace" font-size="12">robot_engineer 0.97</text>
  </g>

</svg>
